<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Portfolio</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===================== Setup screen (initial password setup) ===================== -->
  <div class="auth-screen" id="setupScreen" style="display:none">
    <div class="auth-box">
      <h1 class="auth-box__title">初期設定</h1>
      <p class="auth-box__desc">管理者パスワードを設定してください（8文字以上）</p>
      <form id="setupForm" class="form" novalidate>
        <div class="form__group">
          <label class="form__label" for="setupPw">パスワード <span class="required">*</span></label>
          <input type="password" class="form__input" id="setupPw" placeholder="パスワードを入力" autocomplete="new-password">
        </div>
        <div class="form__group">
          <label class="form__label" for="setupPw2">パスワード（確認） <span class="required">*</span></label>
          <input type="password" class="form__input" id="setupPw2" placeholder="もう一度入力" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn--primary" style="width:100%">設定してはじめる</button>
      </form>
    </div>
  </div>

  <!-- ===================== Login screen ===================== -->
  <div class="auth-screen" id="loginScreen" style="display:none">
    <div class="auth-box">
      <h1 class="auth-box__title">管理者ログイン</h1>
      <form id="loginForm" class="form" novalidate>
        <div class="form__group">
          <label class="form__label" for="loginPw">パスワード</label>
          <input type="password" class="form__input" id="loginPw" placeholder="パスワードを入力" autocomplete="current-password">
          <span class="form__error" id="loginError" style="display:none">パスワードが違います</span>
        </div>
        <button type="submit" class="btn btn--primary" style="width:100%">ログイン</button>
      </form>
    </div>
  </div>

  <!-- ===================== Admin dashboard ===================== -->
  <div id="adminDashboard" style="display:none">

    <header class="admin-header">
      <div class="container">
        <div class="admin-header__inner">
          <h1 class="admin-header__title">
            <a href="index.html">Portfolio</a> <span style="opacity:0.5">—</span> 管理
          </h1>
          <div class="admin-header__actions">
            <button class="btn btn--primary btn--sm" id="addWorkBtn">＋ 作品を追加</button>
            <button class="btn btn--outline btn--sm" id="logoutBtn">ログアウト</button>
          </div>
        </div>
      </div>
    </header>

    <main class="main">
      <div class="container">
        <div class="admin-list" id="worksList"></div>

        <div class="empty-state" id="emptyState">
          <div class="empty-state__icon">📂</div>
          <p>まだ作品が登録されていません</p>
          <button class="btn btn--primary" id="emptyAddBtn">最初の作品を追加する</button>
        </div>
      </div>
    </main>

  </div>

  <!-- ===================== Add / Edit Modal ===================== -->
  <div class="modal" id="workModal" role="dialog" aria-modal="true" aria-labelledby="workModalTitle">
    <div class="modal__backdrop" id="workModalBackdrop"></div>
    <div class="modal__content">
      <div class="modal__header">
        <h2 id="workModalTitle">作品を追加</h2>
        <button class="modal__close" id="workModalClose" aria-label="閉じる">✕</button>
      </div>
      <form id="workForm" class="form" novalidate>
        <input type="hidden" id="editId">
        <div class="form__group">
          <label class="form__label" for="urlInput">URL <span class="required">*</span></label>
          <input type="url" class="form__input" id="urlInput"
            placeholder="https://example.com" autocomplete="off">
        </div>
        <div class="form__group">
          <label class="form__label">サムネイル画像</label>
          <div class="thumb-field">
            <div class="thumb-field__preview" id="thumbPreviewBox">
              <img id="thumbPreviewImg" alt="サムネイルプレビュー" style="display:none">
              <span class="thumb-field__empty" id="thumbPreviewEmpty">未設定</span>
            </div>
            <div class="thumb-field__controls">
              <button type="button" class="btn btn--outline-dark btn--sm" id="thumbFileBtn">
                画像ファイルを選択
              </button>
              <input type="file" id="thumbFileInput" accept="image/*" style="display:none">
              <p class="thumb-field__or">または画像URLを直接入力</p>
              <input type="url" class="form__input" id="thumbInput" placeholder="https://...">
              <button type="button" class="btn btn--ghost btn--sm" id="thumbClearBtn" style="display:none">
                画像をクリア
              </button>
            </div>
          </div>
        </div>
        <div class="form__group">
          <label class="form__label" for="titleInput">タイトル <span class="required">*</span></label>
          <input type="text" class="form__input" id="titleInput"
            placeholder="例：〇〇会社 コーポレートサイト">
        </div>
        <div class="form__group">
          <label class="form__label" for="commentInput">コメント</label>
          <textarea class="form__textarea" id="commentInput" rows="3"
            placeholder="作品の概要や特徴を書いてください"></textarea>
        </div>
        <div class="form__row">
          <div class="form__group">
            <label class="form__label" for="priceInput">料金の目安</label>
            <input type="text" class="form__input" id="priceInput"
              placeholder="例：50,000円〜">
          </div>
          <div class="form__group">
            <label class="form__label" for="periodInput">制作期間</label>
            <input type="text" class="form__input" id="periodInput"
              placeholder="例：2週間">
          </div>
        </div>
        <div class="form__group">
          <label class="form__label" for="scopeInput">対応範囲</label>
          <input type="text" class="form__input" id="scopeInput"
            placeholder="例：デザイン・コーディング・SEO">
        </div>
        <div class="form__group">
          <label class="form__label" for="ingenuityInput">工夫した点</label>
          <textarea class="form__textarea" id="ingenuityInput" rows="4"
            placeholder="デザインや実装で工夫・こだわったポイントを書いてください"></textarea>
        </div>
        <div class="form__footer">
          <button type="button" class="btn btn--ghost" id="workFormCancel">キャンセル</button>
          <button type="submit" class="btn btn--primary" id="workFormSubmit">追加する</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===================== Delete Confirm ===================== -->
  <div class="confirm-dialog" id="confirmDialog" role="dialog" aria-modal="true">
    <div class="confirm-dialog__backdrop" id="confirmBackdrop"></div>
    <div class="confirm-dialog__box">
      <div class="confirm-dialog__icon">🗑️</div>
      <h3 class="confirm-dialog__title">この作品を削除しますか？</h3>
      <p class="confirm-dialog__sub">削除すると元に戻せません</p>
      <div class="confirm-dialog__actions">
        <button class="btn btn--ghost" id="confirmCancel">キャンセル</button>
        <button class="btn btn--danger" id="confirmOk">削除する</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="js/admin.js"></script>
</body>
</html>
